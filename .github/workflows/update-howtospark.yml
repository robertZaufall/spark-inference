name: Update HowToSpark data

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update-howtospark-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install updater dependencies
        run: npm ci

      - name: Fetch, validate, and normalize HowToSpark
        run: |
          npm run update:data
          npm test

      - name: Commit changed data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/howtospark-data.js; then
            echo "HowToSpark data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/howtospark-data.js
          git commit -m "Update HowToSpark benchmark data"
          git fetch origin main
          git rebase origin/main
          npm ci
          npm run update:data
          npm test
          git add data/howtospark-data.js
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
